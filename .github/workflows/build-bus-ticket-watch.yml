name: Build Inder Bus Watch APK

on:
  push:
    branches:
      - main
    paths:
      - 'BusTicketWatch/**'
      - '.github/workflows/build-bus-ticket-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: BusTicketWatch
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InderBusWatch-APK
          path: BusTicketWatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
