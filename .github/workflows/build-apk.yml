

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q SmartSchedule-project.zip -d project

      - name: Apply scrollable widget fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")

          def write_one(pattern, content):
              matches = list(root.rglob(pattern))
              if not matches:
                  if pattern.endswith(".kt"):
                      target = root / "SmartSchedule/app/src/main/java/kz/asckwab/smartschedule" / pattern
                  else:
                      target = root / "SmartSchedule/app/src/main/res/layout" / pattern
                  target.parent.mkdir(parents=True, exist_ok=True)
                  matches = [target]
              matches[0].write_text(content.lstrip(), encoding="utf-8")
              print(f"Updated {matches[0]}")

          write_one("widget_schedule.xml", r"""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_background"
              android:orientation="vertical"
              android:padding="8dp">

              <TextView
                  android:id="@+id/widget_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:text="Моё расписание"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/widget_date"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="1dp"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:text="Синхронизируй расписание"
                  android:textColor="#AFC0DE"
                  android:textSize="11sp" />

              <ListView
                  android:id="@+id/widget_lesson_list"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="3dp"
                  android:divider="#52617B"
                  android:dividerHeight="1dp"
                  android:cacheColorHint="#00000000"
                  android:scrollbars="vertical"
                  android:background="#00000000"
                  android:paddingBottom="1dp" />

              <TextView
                  android:id="@+id/widget_empty"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="top"
                  android:text="Занятий нет"
                  android:textColor="#FFFFFF"
                  android:textSize="11sp"
                  android:visibility="gone" />

              <TextView
                  android:id="@+id/widget_lessons"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:visibility="gone"
                  android:maxLines="5" />
          </LinearLayout>
          """)

          write_one("widget_lesson_row.xml", r"""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:paddingTop="4dp"
              android:paddingBottom="4dp"
              android:paddingStart="1dp"
              android:paddingEnd="1dp"
              android:background="#00000000">
              <TextView
                  android:id="@+id/widget_lesson_time"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#AFC5FF"
                  android:textSize="11sp"
                  android:maxLines="1"
                  android:ellipsize="end" />
              <TextView
                  android:id="@+id/widget_lesson_subject"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="1dp"
                  android:textColor="#FFFFFF"
                  android:textSize="11sp"
                  android:maxLines="2"
                  android:ellipsize="end" />
          </LinearLayout>
          """)

          write_one("ScheduleWidgetProvider.kt", r"""package kz.asckwab.smartschedule

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews
          import java.time.LocalDate

          class ScheduleWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, appWidgetIds: IntArray) {
                  appWidgetIds.forEach { updateOne(context, manager, it) }
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context,
                  manager: AppWidgetManager,
                  appWidgetId: Int,
                  newOptions: android.os.Bundle
              ) {
                  updateOne(context, manager, appWidgetId)
              }

              companion object {
                  fun updateAll(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val component = ComponentName(context, ScheduleWidgetProvider::class.java)
                      manager.getAppWidgetIds(component).forEach { updateOne(context, manager, it) }
                  }

                  private fun updateOne(context: Context, manager: AppWidgetManager, id: Int) {
                      val views = RemoteViews(context.packageName, R.layout.widget_schedule)
                      val openIntent = Intent(context, MainActivity::class.java)
                      val pending = PendingIntent.getActivity(
                          context,
                          2000 + id,
                          openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_title, pending)
                  views.setOnClickPendingIntent(R.id.widget_date, pending)
                  views.setOnClickPendingIntent(R.id.widget_empty, pending)

                      val serviceIntent = Intent(context, ScheduleWidgetService::class.java).apply {
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                          data = Uri.parse(toUri(Intent.URI_INTENT_SCHEME))
                      }
                      views.setRemoteAdapter(R.id.widget_lesson_list, serviceIntent)
                      views.setEmptyView(R.id.widget_lesson_list, R.id.widget_empty)

                      val saved = ScheduleStorage.load(context)
                      val selected = saved?.let { ScheduleLogic.selectDay(it.days) }
                      if (selected == null) {
                          views.setTextViewText(R.id.widget_title, "Моё расписание")
                          views.setTextViewText(R.id.widget_date, "Нет актуальных данных")
                          views.setTextViewText(R.id.widget_empty, "Открой приложение и синхронизируй SmartNation.")
                      } else {
                          val today = LocalDate.now().toString()
                          views.setTextViewText(
                              R.id.widget_title,
                              if (selected.date == today) "Сегодняшние пары" else "Следующий учебный день"
                          )
                          views.setTextViewText(R.id.widget_date, ScheduleLogic.dateLabel(selected))
                          views.setTextViewText(R.id.widget_empty, "Занятий нет")
                      }
                      manager.updateAppWidget(id, views)
                      manager.notifyAppWidgetViewDataChanged(id, R.id.widget_lesson_list)
                  }
              }
          }
          """)

          write_one("ScheduleWidgetService.kt", r"""package kz.asckwab.smartschedule

          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService

          class ScheduleWidgetService : RemoteViewsService() {
              override fun onGetViewFactory(intent: Intent): RemoteViewsFactory =
                  LessonViewsFactory(applicationContext)
          }

          private class LessonViewsFactory(
              private val context: Context
          ) : RemoteViewsService.RemoteViewsFactory {
              private var lessons: List<Lesson> = emptyList()

              override fun onCreate() = Unit

              override fun onDataSetChanged() {
                  val saved = ScheduleStorage.load(context)
                  val selected = saved?.let { ScheduleLogic.selectDay(it.days) }
                  lessons = selected?.lessons.orEmpty()
              }

              override fun onDestroy() {
                  lessons = emptyList()
              }

              override fun getCount(): Int = lessons.size

              override fun getViewAt(position: Int): RemoteViews? {
                  val lesson = lessons.getOrNull(position) ?: return null
                  val row = RemoteViews(context.packageName, R.layout.widget_lesson_row)
                  val time = when {
                      lesson.start.isNotBlank() && lesson.end.isNotBlank() -> "${lesson.start}–${lesson.end}"
                      lesson.start.isNotBlank() -> lesson.start
                      else -> "Время не указано"
                  }
                  val room = lesson.room.takeIf { it.isNotBlank() }?.let { "${it} · " }.orEmpty()
                  row.setTextViewText(R.id.widget_lesson_time, time)
                  row.setTextViewText(R.id.widget_lesson_subject, room + lesson.subject)
                  return row
              }

              override fun getLoadingView(): RemoteViews? = null
              override fun getViewTypeCount(): Int = 1
              override fun getItemId(position: Int): Long = position.toLong()
              override fun hasStableIds(): Boolean = true
          }
          """)

          manifests = list(root.rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest = manifests[0]
          xml = manifest.read_text(encoding="utf-8")
          service = '''        <service
                  android:name=".ScheduleWidgetService"
                  android:permission="android.permission.BIND_REMOTEVIEWS"
                  android:exported="false" />

          '''
          if ".ScheduleWidgetService" not in xml:
              marker = '        <receiver\n            android:name=".ScheduleWidgetProvider"'
              if marker not in xml:
                  raise SystemExit("Cannot locate app-widget receiver in manifest")
              xml = xml.replace(marker, service + marker, 1)
              manifest.write_text(xml, encoding="utf-8")
          print("Scrollable list widget sources are ready.")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add in-app widget button and preserve list scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          files = list(root.rglob("MainActivity.kt"))
          if not files:
              raise SystemExit("MainActivity.kt not found")
          path = files[0]
          text = path.read_text(encoding="utf-8")

          if "requestAddWidget()" not in text:
              text = text.replace(
                  "import android.app.Activity\n",
                  "import android.app.Activity\nimport android.appwidget.AppWidgetManager\nimport android.content.ComponentName\n",
                  1
              )
              text = text.replace(
                  "import android.widget.TextView\n",
                  "import android.widget.TextView\nimport android.widget.Toast\n",
                  1
              )

              function = '''    private fun requestAddWidget() {
                  val manager = AppWidgetManager.getInstance(this)
                  val provider = ComponentName(this, ScheduleWidgetProvider::class.java)
                  if (!manager.isRequestPinAppWidgetSupported) {
                      Toast.makeText(
                          this,
                          "Этот лаунчер не поддерживает добавление из приложения. Добавь виджет через меню виджетов рабочего стола.",
                          Toast.LENGTH_LONG
                      ).show()
                      return
                  }
                  val requested = manager.requestPinAppWidget(provider, null, null)
                  if (!requested) {
                      Toast.makeText(
                          this,
                          "Не удалось открыть запрос. Добавь виджет через меню виджетов рабочего стола.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

          '''
              marker = "    private fun createView() {"
              if marker not in text:
                  raise SystemExit("Could not find createView insertion point")
              text = text.replace(marker, function + marker, 1)

              button = '''
                  val addWidgetButton = Button(this).apply {
                      text = "Добавить виджет на экран"
                      isAllCaps = false
                      setTextColor(Color.rgb(52, 84, 209))
                      background = rounded(Color.WHITE, 14)
                      setOnClickListener { requestAddWidget() }
                  }
                  content.addView(
                      addWidgetButton,
                      LinearLayout.LayoutParams(-1, dp(48)).apply { topMargin = dp(10) }
                  )
              '''
              marker = "        content.addView(syncButton, buttonParams)\n"
              if marker not in text:
                  raise SystemExit("Could not find sync button insertion point")
              text = text.replace(marker, marker + button + "\n", 1)
              path.write_text(text, encoding="utf-8")

          print("Added in-app widget pin button.")
          PY

      - name: Fix widget description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = list(Path("project").rglob("schedule_widget_info.xml"))
          if not matches:
              raise SystemExit("Widget XML file not found")

          widget = matches[0]
          xml = widget.read_text(encoding="utf-8")
          reference = 'android:description="@string/schedule_widget_description"'

          if reference not in xml:
              xml, count = re.subn(
                  r'android:description="[^"]*"',
                  reference,
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not fix widget description")
              widget.write_text(xml, encoding="utf-8")

          def set_widget_attr(text, name, value):
              pattern = rf'android:{name}="[^"]*"'
              replacement = f'android:{name}="{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, replacement, text, count=1)
              return text.replace("<appwidget-provider ", f'<appwidget-provider {replacement} ', 1)

          for attr, value in {
              "minWidth": "160dp",
              "minHeight": "100dp",
              "minResizeWidth": "110dp",
              "minResizeHeight": "70dp",
              "targetCellWidth": "2",
              "targetCellHeight": "2",
              "resizeMode": "horizontal|vertical",
          }.items():
              xml = set_widget_attr(xml, attr, value)
          widget.write_text(xml, encoding="utf-8")

          values = widget.parent.parent / "values"
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"
          name = 'name="schedule_widget_description"'

          if strings.exists():
              content = strings.read_text(encoding="utf-8")
              if name not in content:
                  content = content.replace(
                      "</resources>",
                      '    <string name="schedule_widget_description">Сегодняшние пары и кабинеты из SmartNation</string>\n</resources>'
                  )
                  strings.write_text(content, encoding="utf-8")
          else:
              strings.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <string name="schedule_widget_description">Сегодняшние пары и кабинеты из SmartNation</string>\n'
                  '</resources>\n',
                  encoding="utf-8"
              )

          print("Widget description fixed")
          PY

      - name: Prepare side-by-side widget test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project")
          build_files = list(root.rglob("app/build.gradle.kts"))
          if not build_files:
              raise SystemExit("app/build.gradle.kts not found")
          build_file = build_files[0]
          build_text = build_file.read_text(encoding="utf-8")
          build_text, count = re.subn(
              r'applicationId\s*=\s*"kz\.asckwab\.smartschedule"',
              'applicationId = "kz.asckwab.smartschedule.widgetfix"',
              build_text,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not set existing widgetfix application ID")

          build_text, code_count = re.subn(
              r'versionCode\s*=\s*1',
              'versionCode = 2',
              build_text,
              count=1
          )
          build_text, name_count = re.subn(
              r'versionName\s*=\s*"1\.0\.0"',
              'versionName = "1.1.0"',
              build_text,
              count=1
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not bump update version to 1.1.0 (code 2)")
          build_file.write_text(build_text, encoding="utf-8")

          manifests = list(root.rglob("app/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest = manifests[0]
          manifest_text = manifest.read_text(encoding="utf-8")
          manifest_text = manifest_text.replace(
              'android:label="Smart Расписание — тест"',
              'android:label="Smart Расписание"',
              1
          )
          manifest.write_text(manifest_text, encoding="utf-8")
          print("Side-by-side test package ID and app label set.")
          PY

      - name: Configure stable app identity and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import time

          root = Path("project")
          matches = list(root.rglob("app/build.gradle.kts"))
          if not matches:
              raise SystemExit("app/build.gradle.kts not found")
          build_file = matches[0]
          text = build_file.read_text(encoding="utf-8")

          text, app_count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "kz.asckwab.smartschedule.foundation"',
              text,
              count=1
          )
          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {int(time.time()) - 1577836800}',
              text,
              count=1
          )
          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "1.0.0"',
              text,
              count=1
          )
          if app_count != 1 or code_count != 1 or name_count != 1:
              raise SystemExit("Could not configure stable package/version")
          build_file.write_text(text, encoding="utf-8")

          manifests = list(root.rglob("app/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest = manifests[0]
          xml = manifest.read_text(encoding="utf-8")
          xml, label_count = re.subn(
              r'android:label="[^"]*"',
              'android:label="Smart Расписание — новая основа"',
              xml,
              count=1
          )
          if label_count != 1:
              raise SystemExit("Could not set stable app label")
          manifest.write_text(xml, encoding="utf-8")
          print("Stable application ID, version code, and label configured.")
          PY

      - name: Locate project
        id: project
        run: |
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Sign APK with persistent private key
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ANDROID_SIGNING_BUNDLE" ]; then
            echo "::error::Repository Actions secret ANDROID_SIGNING_BUNDLE is required."
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          bundle = os.environ["ANDROID_SIGNING_BUNDLE"].strip()
          try:
              encoded, password = bundle.split(":", 1)
              keystore = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_SIGNING_BUNDLE has an invalid format") from exc

          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "smartschedule-release.p12").write_bytes(keystore)
          (temp / "smartschedule-signing-pass").write_text(password, encoding="utf-8")
          PY

          KEYSTORE="$RUNNER_TEMP/smartschedule-release.p12"
          PASSWORD="$(cat "$RUNNER_TEMP/smartschedule-signing-pass")"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Could not locate Android apksigner."
            exit 1
          fi

          mapfile -t APKS < <(find project -type f -name '*.apk' -path '*/build/outputs/apk/*')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files found to sign."
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias smartschedule --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" --out "$APK.signed" "$APK"
            mv "$APK.signed" "$APK"
            "$APKSIGNER" verify "$APK"
            echo "Signed and verified $(basename "$APK")"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchedule-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
